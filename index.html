<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Gift Tracker</title>
    <style>
        /* Mengambil palet warna dari gambar referensi */
        :root {
            --sky-blue: #70A0D5;
            --cloud-cream: #F5EFEB;
            --tree-blue: #4A83C4;
            --accent-orange: #F27B5A;
            --grass-green: #9DC18B;
            --text-dark: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--sky-blue);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            /* Latar belakang menyerupai awan dan bukit */
            background-image: linear-gradient(to bottom, var(--sky-blue) 60%, var(--grass-green) 100%);
        }

        .card {
            background-color: var(--cloud-cream);
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            padding: 30px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background-color: var(--accent-orange);
        }

        h1 {
            color: var(--tree-blue);
            font-size: 28px;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .amount-box {
            background-color: white;
            border: 2px solid var(--sky-blue);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .amount-box p {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .total-amount {
            font-size: 32px;
            font-weight: bold;
            color: var(--tree-blue);
        }

        .goals-container {
            text-align: left;
            margin-bottom: 20px;
            padding: 15px;
            background-color: rgba(157, 193, 139, 0.15); /* light green */
            border-radius: 12px;
        }

        .goals-container h3 {
            font-size: 16px;
            color: var(--tree-blue);
            margin-bottom: 10px;
        }

        .status-text {
            font-size: 15px;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .highlight {
            font-weight: bold;
            color: var(--accent-orange);
        }

        /* Progress Bar Styles */
        .progress-wrapper {
            margin-top: 15px;
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 12px;
            width: 100%;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent-orange);
            width: 0%;
            transition: width 1s ease-in-out;
        }

        .milestones {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #777;
            margin-top: 5px;
        }

        .loading {
            font-style: italic;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Wedding Gift 💍</h1>
        
        <div class="amount-box">
            <p>Dana Terkumpul</p>
            <div class="total-amount" id="display-total"><span class="loading">Memuat data...</span></div>
        </div>

        <div class="goals-container">
            <h3>Status Target</h3>
            <div class="status-text" id="display-status">
                <span class="loading">Menghitung target...</span>
            </div>
            
            <div class="progress-wrapper">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
            <div class="milestones">
                <span>0</span>
                <span>1jt</span>
                <span>1.5jt</span>
                <span>2jt</span>
                <span>2.5jt</span>
            </div>
        </div>
    </div>

    <script>
        // === PENTING: MASUKKAN LINK CSV GOOGLE SHEETS ANDA DI SINI ===
        // Pastikan format linknya berakhiran pub?output=csv
        const sheetCSVUrl = 'MASUKKAN_LINK_CSV_GOOGLE_SHEETS_DI_SINI'; 

        // Target Goals (dalam Rupiah)
        const goals = [1000000, 1500000, 2000000, 2500000];
        const maxGoal = goals[goals.length - 1];

        // Format angka ke Rupiah (Rp)
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(number);
        };

        // Mengambil data dari Google Sheets
        async function fetchSheetData() {
            try {
                const response = await fetch(sheetCSVUrl);
                const data = await response.text();
                
                // Parse CSV
                const rows = data.split('\n');
                let totalAmount = 0;

                // Mulai dari baris ke-1 (melewati header "From,Jumlah")
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i].split(',');
                    if (row.length >= 2) {
                        // Bersihkan string dari tanda kutip jika ada, lalu ubah ke angka
                        const amount = parseFloat(row[1].replace(/["']/g, "").trim());
                        if (!isNaN(amount)) {
                            totalAmount += amount;
                        }
                    }
                }

                updateUI(totalAmount);

            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('display-total').innerHTML = '<span style="color:red; font-size:16px;">Gagal memuat data. Pastikan link CSV benar.</span>';
                document.getElementById('display-status').innerHTML = '';
            }
        }

        // Memperbarui tampilan Web
        function updateUI(total) {
            // Tampilkan Total
            document.getElementById('display-total').innerText = formatRupiah(total);

            // Cari target terdekat
            let currentGoal = goals.find(g => g > total);
            let statusHTML = "";

            if (currentGoal) {
                let kurang = currentGoal - total;
                statusHTML = `Target terdekat: <strong>${formatRupiah(currentGoal)}</strong><br>
                              Kurang <span class="highlight">${formatRupiah(kurang)}</span> lagi!`;
            } else {
                statusHTML = `<span class="highlight">Luar Biasa!</span> Semua target pencapaian (${formatRupiah(maxGoal)}) telah terlampaui. Terima kasih! 🎉`;
                currentGoal = maxGoal; // Untuk kalkulasi progress bar
            }

            document.getElementById('display-status').innerHTML = statusHTML;

            // Update Progress Bar (Kalkulasi persentase berdasarkan max goal)
            let percentage = (total / maxGoal) * 100;
            if (percentage > 100) percentage = 100;
            document.getElementById('progress-bar').style.width = percentage + '%';
        }

        // Panggil fungsi saat web dimuat
        if(sheetCSVUrl === 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT-xE85J8Ehed4EhHAPVT_A9XjyVdtE1CQzjlExaZHesUurZdG3UUNK5nN8HI7rkHKr8QjmtGxHQ6I8/pub?output=csv') {
             document.getElementById('display-total').innerHTML = '<span style="color:red; font-size:14px;">Tolong ganti URL CSV di dalam kode terlebih dahulu.</span>';
             document.getElementById('display-status').innerHTML = '';
        } else {
            fetchSheetData();
        }
    </script>
</body>
</html>
