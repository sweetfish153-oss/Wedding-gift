<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Gift</title>
    <!-- Font Cursive (Bersambung) untuk Judul -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #ED5658; /* Merah coral */
            --line-fill: #46C4E9; /* Biru terang */
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Dirubah agar tidak terpotong di HP */
            font-family: Arial, sans-serif;
            color: white;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 56px;
            font-weight: 700;
            margin-bottom: 90px;
            letter-spacing: 2px;
            text-align: center;
        }

        .progress-container {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .label {
            font-size: 15px;
            white-space: nowrap;
        }

        .track {
            flex-grow: 1;
            height: 3px;
            background-color: white;
            margin: 0 15px;
            position: relative;
            border-radius: 2px;
        }

        /* Titik-titik Milestone (500k, 1jt, dll) */
        .milestone {
            position: absolute;
            top: -2px; 
            width: 7px;
            height: 7px;
            background-color: white;
            border-radius: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }

        .milestone span {
            position: absolute;
            top: -24px; 
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.9);
            white-space: nowrap;
        }

        /* Garis yang sudah terisi */
        .fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background-color: var(--line-fill);
            width: 0%; 
            border-radius: 2px;
            transition: width 1.5s ease-in-out;
            z-index: 2; 
        }

        /* Titik awal */
        .track::before {
            content: '';
            position: absolute;
            left: -4px;
            top: -3px;
            width: 9px;
            height: 9px;
            background-color: var(--line-fill);
            border-radius: 50%;
            z-index: 3;
        }

        /* Titik Akhir */
        .track::after {
            content: '';
            position: absolute;
            right: -4px;
            top: -3px;
            width: 9px;
            height: 9px;
            background-color: white;
            border-radius: 50%;
        }

        .marker {
            position: absolute;
            right: 0;
            top: 1.5px;
            transform: translate(50%, -50%); 
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* Icon Bunga */
        .flower {
            width: 38px;
            height: 38px;
            fill: white;
            filter: drop-shadow(0px 3px 2px rgba(0,0,0,0.15));
        }

        /* Kotak Nominal di Bawah Bunga */
        .tooltip {
            margin-top: 10px;
            border: 1.5px solid white;
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 14px;
            position: relative;
            background-color: var(--bg-color);
            white-space: nowrap;
        }

        .tooltip::before {
            content: '';
            position: absolute;
            top: -5.5px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 8px;
            height: 8px;
            border-left: 1.5px solid white;
            border-top: 1.5px solid white;
            background-color: var(--bg-color);
        }

        /* --- DESAIN RINCIAN BUDGET BARU --- */
        .budget-details {
            margin-top: 80px; /* Jarak agar tidak menabrak kotak nominal di atasnya */
            width: 100%;
            max-width: 400px; /* Dibuat sedikit lebih kecil dari lebar garis agar manis */
            text-align: left;
            background: rgba(255, 255, 255, 0.08); /* Efek transparan sedikit */
            padding: 20px 25px;
            border-radius: 12px;
        }

        .budget-details p {
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 10px 0;
            letter-spacing: 0.5px;
        }

        .budget-details ol {
            margin: 0;
            padding-left: 20px;
            font-size: 14px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.95);
        }
    </style>
</head>
<body>

    <h1>Wedding Gift</h1>
    
    <div class="progress-container">
        <span class="label">0</span>
        
        <div class="track">
            
            <!-- Milestones (Titik dan Angka) -->
            <div class="milestone" style="left: 20%;"><span>500k</span></div>
            <div class="milestone" style="left: 40%;"><span>1 jt</span></div>
            <div class="milestone" style="left: 60%;"><span>1.5 jt</span></div>
            <div class="milestone" style="left: 80%;"><span>2 jt</span></div>

            <!-- Garis Biru Progress -->
            <div class="fill" id="fill-bar">
                <div class="marker">
                    
                    <!-- Icon Bunga Berwarna Putih -->
                    <svg class="flower" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12,2C10.5,2 9.5,4 9.5,5.5C9.5,6.5 10.2,7.4 11.1,7.8C9.5,7.3 7.5,6.6 6,7.5C4.5,8.4 5.2,10.6 6.3,11.5C7.2,12.2 8.3,12.3 9.4,12C8,12.7 6,13.8 5.5,15.5C5,17.2 7,18.5 8.5,18C10,17.5 11,15.8 11.4,14.6C11.3,16.2 11.4,18.8 12.5,19.5C13.6,20.2 15.5,19.2 16,17.5C16.5,15.8 15.5,14 14.5,13C16,13.8 18.2,14.2 19.5,12.5C20.8,10.8 18.8,9.2 17.5,8.8C16.2,8.4 14.5,9.2 13.5,10C13.8,8.5 14.5,6.2 13.5,5C12.5,3.8 12,2 12,2Z"/>
                        <circle cx="12" cy="12" r="1.5" fill="#ED5658" />
                    </svg>
                    
                    <!-- Teks Angka yang Terkumpul -->
                    <div class="tooltip" id="current-amount">Memuat...</div>
                
                </div>
            </div>
        </div>
        
        <span class="label">2.5 jt</span>
    </div>

    <!-- Bagian Rincian Budget -->
    <div class="budget-details">
        <p>Rencana budget:</p>
        <ol>
            <li>Persiapan Bridal Shower (200k-400k)</li>
            <li>Tiket bermalam (1jt-2jt)</li>
        </ol>
    </div>

    <script>
        // =====================================================================
        // MASUKKAN LINK CSV ANDA DI DALAM TANDA KUTIP DI BAWAH INI
        // Contoh: const sheetCSVUrl = 'https://docs.google.com/spreadsheets/...';
        // =====================================================================
        const sheetCSVUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT-xE85J8Ehed4EhHAPVT_A9XjyVdtE1CQzjlExaZHesUurZdG3UUNK5nN8HI7rkHKr8QjmtGxHQ6I8/pub?output=csv'; 
        
        const maxGoal = 2500000; // Target maksimal (2.5 Juta)

        // Format ke Rupiah
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(number);
        };

        async function fetchSheetData() {
            try {
                const response = await fetch(sheetCSVUrl);
                if (!response.ok) throw new Error("Gagal load data dari link");
                
                const data = await response.text();
                const rows = data.split('\n');
                let totalAmount = 0;

                for (let i = 1; i < rows.length; i++) {
                    let firstCommaIndex = rows[i].indexOf(',');
                    
                    if (firstCommaIndex !== -1) {
                        let amountText = rows[i].substring(firstCommaIndex + 1);
                        let cleanText = amountText.replace(/[^0-9]/g, '');
                        const amount = parseInt(cleanText, 10);
                        
                        if (!isNaN(amount)) {
                            totalAmount += amount;
                        }
                    }
                }

                updateUI(totalAmount);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('current-amount').innerText = "Cek Link CSV";
            }
        }

        function updateUI(total) {
            document.getElementById('current-amount').innerText = formatRupiah(total);

            let percentage = (total / maxGoal) * 100;
            if (percentage > 100) percentage = 100; 
            
            setTimeout(() => {
                document.getElementById('fill-bar').style.width = percentage + '%';
            }, 300); 
        }

        fetchSheetData();
    </script>
</body>
</html>
