<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Gift</title>
    <!-- Font Cursive (Bersambung) untuk Judul -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Warna diambil dari gambar referensi Anda */
            --bg-color: #ED5658; /* Merah coral */
            --line-fill: #46C4E9; /* Biru terang */
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 56px;
            font-weight: 700;
            margin-bottom: 90px;
            letter-spacing: 2px;
        }

        .progress-container {
            display: flex;
            align-items: center;
            width: 85%;
            max-width: 600px;
        }

        .label {
            font-size: 15px;
            white-space: nowrap;
        }

        .track {
            flex-grow: 1;
            height: 3px;
            background-color: white;
            margin: 0 15px;
            position: relative;
            border-radius: 2px;
        }

        /* Garis yang sudah terisi */
        .fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background-color: var(--line-fill);
            width: 0%; /* Akan diisi otomatis oleh data */
            border-radius: 2px;
            transition: width 1.5s ease-in-out;
        }

        /* Titik awal */
        .track::before {
            content: '';
            position: absolute;
            left: -4px;
            top: -3px;
            width: 9px;
            height: 9px;
            background-color: var(--line-fill);
            border-radius: 50%;
        }

        /* Titik Akhir */
        .track::after {
            content: '';
            position: absolute;
            right: -4px;
            top: -3px;
            width: 9px;
            height: 9px;
            background-color: white;
            border-radius: 50%;
        }

        .marker {
            position: absolute;
            right: 0;
            top: 1.5px;
            transform: translate(50%, -50%); /* Menempatkan icon pas di ujung garis */
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* Icon Bunga */
        .flower {
            width: 38px;
            height: 38px;
            fill: white;
            filter: drop-shadow(0px 3px 2px rgba(0,0,0,0.15));
        }

        /* Kotak Nominal */
        .tooltip {
            margin-top: 10px;
            border: 1.5px solid white;
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 14px;
            position: relative;
            background-color: var(--bg-color);
            white-space: nowrap;
        }

        /* Segitiga panah ke atas pada kotak */
        .tooltip::before {
            content: '';
            position: absolute;
            top: -5.5px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 8px;
            height: 8px;
            border-left: 1.5px solid white;
            border-top: 1.5px solid white;
            background-color: var(--bg-color);
        }
    </style>
</head>
<body>

    <h1>Wedding Gift</h1>
    
    <div class="progress-container">
        <span class="label">0</span>
        
        <div class="track">
            <div class="fill" id="fill-bar">
                <div class="marker">
                    
                    <!-- Icon Bunga Berwarna Putih -->
                    <svg class="flower" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12,2C10.5,2 9.5,4 9.5,5.5C9.5,6.5 10.2,7.4 11.1,7.8C9.5,7.3 7.5,6.6 6,7.5C4.5,8.4 5.2,10.6 6.3,11.5C7.2,12.2 8.3,12.3 9.4,12C8,12.7 6,13.8 5.5,15.5C5,17.2 7,18.5 8.5,18C10,17.5 11,15.8 11.4,14.6C11.3,16.2 11.4,18.8 12.5,19.5C13.6,20.2 15.5,19.2 16,17.5C16.5,15.8 15.5,14 14.5,13C16,13.8 18.2,14.2 19.5,12.5C20.8,10.8 18.8,9.2 17.5,8.8C16.2,8.4 14.5,9.2 13.5,10C13.8,8.5 14.5,6.2 13.5,5C12.5,3.8 12,2 12,2Z"/>
                        <circle cx="12" cy="12" r="1.5" fill="#ED5658" />
                    </svg>
                    
                    <!-- Teks Angka yang Terkumpul -->
                    <div class="tooltip" id="current-amount">Memuat...</div>
                
                </div>
            </div>
        </div>
        
        <span class="label">2.5 jt</span>
    </div>

    <script>
        // === MASUKKAN LINK CSV GOOGLE SHEETS ANDA DI SINI ===
        // Pastikan link-nya berakhiran pub?output=csv
        const sheetCSVUrl = 'MASUKKAN_LINK_CSV_GOOGLE_SHEETS_DI_SINI'; 
        
        const maxGoal = 2500000; // Target maksimal (2.5 Juta)

        // Format ke Rupiah
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(number);
        };

        async function fetchSheetData() {
            try {
                const response = await fetch(sheetCSVUrl);
                if (!response.ok) throw new Error("Gagal load data");
                
                const data = await response.text();
                const rows = data.split('\n');
                let totalAmount = 0;

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i].split(',');
                    if (row.length >= 2) {
                        
                        // [PERBAIKAN ERROR]: Kode ini akan membuang otomatis teks "Rp", spasi, 
                        // maupun titik "." di excel Anda sehingga murni menyisakan angkanya saja.
                        let cleanText = row[1].replace(/[^0-9]/g, '');
                        const amount = parseInt(cleanText, 10);
                        
                        if (!isNaN(amount)) {
                            totalAmount += amount;
                        }
                    }
                }

                updateUI(totalAmount);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('current-amount').innerText = "Cek Link CSV";
            }
        }

        function updateUI(total) {
            // Tulis nominal di dalam kotak
            document.getElementById('current-amount').innerText = formatRupiah(total);

            // Hitung persentase untuk menggeser garis & icon bunga
            let percentage = (total / maxGoal) * 100;
            if (percentage > 100) percentage = 100; // Mentok di ujung jika lebih dari 2.5jt
            
            // Beri sedikit jeda agar ada animasi jalan
            setTimeout(() => {
                document.getElementById('fill-bar').style.width = percentage + '%';
            }, 300); 
        }

        if(sheetCSVUrl !== 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT-xE85J8Ehed4EhHAPVT_A9XjyVdtE1CQzjlExaZHesUurZdG3UUNK5nN8HI7rkHKr8QjmtGxHQ6I8/pub?output=csv') {
            fetchSheetData();
        }
    </script>
</body>
</html>
